<title>ALLXAI - Loading</title>
<style>
  :root{ --bg:#070b12; --ink:#e8f0f7; --muted:#8598ad; --cyan:#22c9e0; --cyan2:#2f8cff; --line:#1b2838; }
  @media (prefers-reduced-motion: reduce){ .bar-fill{animation:none !important} }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:
      radial-gradient(1100px 600px at 50% 38%, rgba(34,201,224,.12), transparent 62%),
      radial-gradient(800px 500px at 50% 90%, rgba(47,140,255,.08), transparent 60%),
      var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;display:grid;place-items:center;min-height:100vh;padding:24px}
  .stage{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:420px}
  /* logo icon (placeholder mark - swap for real asset) */
  .mark{filter:drop-shadow(0 12px 34px rgba(34,201,224,.4));animation:axIn .6s ease both, axFloat 4.6s ease-in-out .6s infinite}
  .mark svg{display:block}
  .wordmark{margin-top:20px;font-size:34px;font-weight:800;letter-spacing:1.5px;animation:axIn .6s ease .15s both}
  .wordmark-img{width:210px;max-width:72vw;height:auto;margin-top:16px;animation:axIn .6s ease .15s both}
  .wordmark .x{color:var(--cyan);display:inline-block;transform-origin:50% 50%;margin:0 .04em;animation:xspin 12s linear infinite}
  .tag{margin-top:6px;color:var(--cyan);font-weight:600;letter-spacing:.5px;font-size:14px}
  /* progress */
  .track{width:280px;max-width:78vw;height:6px;margin-top:22px;border-radius:999px;background:#132030;overflow:hidden}
  .bar-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--cyan2));transition:width .18s ease}
  .row{display:flex;justify-content:space-between;width:280px;max-width:78vw;margin-top:10px;color:var(--muted);font-size:12.5px}
  .pct{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
  .soon{margin-top:30px;font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
  @keyframes axIn{from{opacity:0;transform:scale(.82) translateY(6px)}to{opacity:1;transform:none}}
  @keyframes axFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @media (prefers-reduced-motion: reduce){ .axmark,.wordmark,.brandmark,.logo{animation:none !important} }

  /* --- animated ALLXAI mark (shared component) --- */
  .axlogo{position:relative;display:inline-grid;place-items:center;width:var(--axsz,132px);height:var(--axsz,132px);flex:0 0 auto}
  .axlogo .r{display:none}
  .axlogo .r1{inset:0;border:2px dotted rgba(3,217,217,.60);animation:axRing 7s linear infinite}
  .axlogo .r2{inset:12%;border:1.5px dotted rgba(3,137,166,.55);animation:axRingR 10s linear infinite}
  .axlogo .l{position:absolute;width:64%;left:18%;top:4%;height:auto}
  .axlogo .lt{animation:axReveal 1.1s cubic-bezier(.2,.75,.25,1) both;filter:drop-shadow(0 5px 14px rgba(3,137,166,.35))}
  .axlogo .lb{animation:axReveal 1.1s cubic-bezier(.2,.75,.25,1) .9s both;filter:drop-shadow(0 6px 16px rgba(3,217,217,.4))}
  @keyframes axReveal{0%{opacity:0;transform:translateY(-9px) scale(.86)}100%{opacity:1;transform:none}}
  @keyframes axRing{0%{transform:rotate(0) scale(1);opacity:.6}50%{transform:rotate(180deg) scale(1.13);opacity:1}100%{transform:rotate(360deg) scale(1);opacity:.6}}
  @keyframes axRingR{0%{transform:rotate(0) scale(1.08);opacity:.5}50%{transform:rotate(-180deg) scale(.94);opacity:.85}100%{transform:rotate(-360deg) scale(1.08);opacity:.5}}
  @media (prefers-reduced-motion: reduce){ .axlogo .r1,.axlogo .r2,.axlogo .lt,.axlogo .lb{animation:none !important} }
  @keyframes xspin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .x{animation:none !important} }
</style>
</head>
