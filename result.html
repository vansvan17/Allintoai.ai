<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex,nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="assets/favicon.png" />
<title>ALLXAI - Your recommendation</title>
<link rel="stylesheet" href="beta/beta.css" />
</head>
<body>
<main class="main">
  <div id="errNote" class="note err hidden" role="alert"></div>
  <div id="content" class="hidden">
    <h1>Your recommendation</h1>
    <p class="lead" id="summary"></p>

    <div class="picks">
      <section class="pick main-pick" aria-labelledby="pkModel">
        <div class="k" id="pkLabel"></div>
        <h2 id="pkModel"></h2>
        <div class="stats">
          <div class="stat"><div class="l">Accuracy</div><div class="v" id="pkAcc"></div></div>
          <div class="stat"><div class="l">Scale</div><div class="v" id="pkScale"></div></div>
          <div class="stat"><div class="l">Per task</div><div class="v" id="pkCost"></div></div>
        </div>
        <p id="pkNote"></p>
      </section>
      <section class="pick alt" aria-labelledby="cbModel">
        <div class="k">BEST COMBINATION</div>
        <h2 id="cbModel"></h2>
        <div class="stats">
          <div class="stat"><div class="l">Accuracy</div><div class="v" id="cbAcc"></div></div>
          <div class="stat"><div class="l">Scale</div><div class="v" id="cbScale"></div></div>
          <div class="stat"><div class="l">Per task</div><div class="v" id="cbCost"></div></div>
        </div>
        <p id="cbNote"></p>
      </section>
    </div>

    <div class="section">
      <h3>Estimated impact <span class="tag">Estimate</span></h3>
      <div class="est">
        <div><div class="l">Budget saved</div><div class="v" id="esSaved"></div><div class="s">per month</div></div>
        <div><div class="l">Return on spend</div><div class="v" id="esRoi"></div><div class="s">saved for every ₹1 spent, per month</div></div>
        <div><div class="l">Time saved</div><div class="v" id="esHours"></div><div class="s">hours per month</div></div>
      </div>
      <p class="hint" id="esBasis"></p>
    </div>

    <div class="actions">
      <a class="btn" id="wfBtn" href="#"></a>
      <a class="btn ghost" href="request.html">New request</a>
      <a class="btn ghost" href="plans.html">See plans</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="beta/config.js"></script>
<script src="beta/data.js"></script>
<script src="beta/ui.js"></script>
<script src="beta/recommender.js"></script>
<script>
(function () {
  "use strict";
  var R = window.AXRec, AX = window.AX, UI = window.AXUI;
  function $(id) { return document.getElementById(id); }
  function set(id, text) { $(id).textContent = text; }
  function fail(msg) { var e = $("errNote"); e.textContent = msg; e.classList.remove("hidden"); }

  var id = new URLSearchParams(location.search).get("id");

  AX.requireSession().then(function (s) {
    UI.header(s);
    if (!id) throw new Error("No request selected.");
    return AX.getRequest(id);
  }).then(function (row) {
    if (!row) { fail("This request was not found on your account. Start a new one from the request page."); return; }
    var r = row.result;
    var cat = R.CATEGORIES[r.category] || R.CATEGORIES.other;
    var vol = R.VOLUMES[row.volume];
    var pri = R.PRIORITIES[r.priority];

    set("summary", cat.label + " · " + (vol ? vol.label : "") + " tasks a month · " + (pri ? pri.label : ""));

    set("pkLabel", r.primary.label.toUpperCase());
    set("pkModel", r.primary.model);
    set("pkAcc", r.primary.accuracy + "%");
    set("pkScale", r.primary.scale);
    set("pkCost", "₹" + r.primary.cost.toFixed(2));
    set("pkNote", r.primary.tier + " tier. One model handles every task.");

    set("cbModel", r.combo.models.join(" + "));
    set("cbAcc", r.combo.accuracy + "%");
    set("cbScale", r.combo.scale);
    set("cbCost", "₹" + r.combo.cost.toFixed(2));
    set("cbNote", r.combo.models[0] + " handles every task first; about " + r.combo.escalatePercent +
      "% of harder cases go to " + r.combo.models[1] + ".");

    if (r.sample) {
      ["pkModel", "cbModel"].forEach(function (x) {
        var t = UI.el("span", { "class": "tag" }, "Sample ratings");
        $(x).appendChild(t);
      });
    }

    set("esSaved", UI.fmtINR(r.estimates.budgetSaved));
    set("esRoi", r.estimates.roi + "×");
    set("esHours", String(r.estimates.hoursSaved));
    set("esBasis", "Based on about " + r.estimates.tasksPerMonth.toLocaleString("en-IN") +
      " tasks a month and your plan price. Actual results depend on your setup.");

    var wf = $("wfBtn");
    if (r.workflow.url) {
      wf.textContent = "Open workflow: " + r.workflow.name;
      wf.href = r.workflow.url;
    } else {
      wf.textContent = "Ask about the " + r.workflow.name + " workflow";
      wf.href = "index.html#contact";
    }
    $("content").classList.remove("hidden");
  }).catch(function (e) { fail("Could not load this result: " + e.message); });
})();
</script>
</body>
</html>
