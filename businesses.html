<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex,nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="assets/favicon.png" />
<title>ALLXAI - Businesses on ALL×AI</title>
<link rel="stylesheet" href="beta/beta.css" />
<style>
  .list{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .list th,.list td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px}
  .list th{font-size:12.5px;color:var(--muted);font-weight:650;background:var(--raise)}
  .list tr:last-child td{border-bottom:0}
  .list td.num{font-weight:700;font-variant-numeric:tabular-nums}
  .priv{color:var(--cyan);font-size:13.5px;white-space:nowrap}
  .empty{text-align:center;padding:36px 20px}
  .empty p{color:var(--muted);margin:0 0 18px}
  .wrap-table{overflow-x:auto;border-radius:14px}
</style>
</head>
<body>
<main class="main">
  <h1>Businesses on ALL×AI</h1>
  <p class="lead">Businesses that chose to be listed. Model choices stay private: only operations accuracy is shown.</p>
  <div id="errNote" class="note err hidden" role="alert"></div>

  <div id="tableWrap" class="wrap-table hidden">
    <table class="list">
      <thead><tr><th scope="col">Business</th><th scope="col">Sector</th><th scope="col">Ops accuracy</th><th scope="col">Models</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="empty" class="card empty hidden">
    <p>No businesses are listed yet.</p>
  </div>

  <div class="actions">
    <a class="btn" href="request.html">Solve my problem next</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="beta/config.js"></script>
<script src="beta/data.js"></script>
<script src="beta/ui.js"></script>
<script>
(function () {
  "use strict";
  var AX = window.AX, UI = window.AXUI;
  function $(id) { return document.getElementById(id); }

  AX.requireSession().then(function (s) {
    UI.header(s);
    return AX.listListings();
  }).then(function (rows) {
    if (!rows || !rows.length) { $("empty").classList.remove("hidden"); return; }
    var body = $("rows");
    rows.forEach(function (r) {
      var tr = UI.el("tr");
      tr.appendChild(UI.el("td", null, r.business_name));
      tr.appendChild(UI.el("td", null, r.sector || ""));
      tr.appendChild(UI.el("td", { "class": "num" }, r.ops_accuracy == null ? "Pending" : Number(r.ops_accuracy) + "%"));
      tr.appendChild(UI.el("td", { "class": "priv" }, "Private"));
      body.appendChild(tr);
    });
    $("tableWrap").classList.remove("hidden");
  }).catch(function (e) {
    var n = $("errNote"); n.textContent = "Could not load the list: " + e.message; n.classList.remove("hidden");
  });
})();
</script>
</body>
</html>
